<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Samuel Felipe Quiroz Piñeros — Front-End Developer">
  <defs>
    <radialGradient id="a" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a97bff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a97bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5fd3c4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5fd3c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".5" fill="#fff" fill-opacity=".05"/>
    </pattern>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="1130" y2="0">
      <stop offset="0" stop-color="#5fd3c4"/>
      <stop offset="1" stop-color="#a97bff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
  </defs>
  <style>
    .rise { opacity: 0; animation: rise 1s cubic-bezier(.16,1,.3,1) forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .9s }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .draw { stroke-dasharray: 1060; stroke-dashoffset: 1060; animation: draw 1.6s cubic-bezier(.77,0,.18,1) .6s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .rise, .draw { animation: none; opacity: 1; stroke-dashoffset: 0 } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0b1416"/>
    <circle cx="180" cy="40" r="300" fill="url(#a)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 120 60; -40 110; 0 0" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="300" r="320" fill="url(#b)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -140 -50; 60 -100; 0 0" dur="28s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="320" fill="url(#grain)"/>
    <rect x=".5" y=".5" width="1199" height="319" rx="14" fill="none" stroke="#22343a"/>

    <g class="rise d1">
      <line x1="70" y1="96" x2="110" y2="96" stroke="#a97bff"/>
      <text x="126" y="101" fill="#a97bff" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2.4">FRONT-END DEVELOPER · ZIPAQUIRÁ, COLOMBIA</text>
      <rect class="caret" x="548" y="88" width="8" height="16" fill="#a97bff"/>
    </g>
    <text class="rise d2" x="66" y="190" fill="#e9f1f1" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="74" letter-spacing="-1.5">Samuel Felipe Quiroz <tspan fill="#a97bff" font-style="italic">Piñeros</tspan></text>
    <path class="draw" d="M70 228 H1130" stroke="url(#rule)" stroke-width="2" fill="none"/>
    <text class="rise d3" x="70" y="268" fill="#86999c" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="1">
      <tspan fill="#5fd3c4">§</tspan> interfaces rápidas, accesibles y con detalle — React · Next.js · TypeScript · Tailwind
    </text>
  </g>
</svg>
